name: Security Scans

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: 
      - main

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Dependency scan
      run: |
        pip install pip-audit
        pip-audit